<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103833"/>
      <stop offset="100%" stop-color="#174C45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#4C9A83" stroke-width="8" opacity="0.4"/>
  
  <!-- Clinical Cross & Heart Symbol -->
  <g transform="translate(256, 210)">
    <!-- Vertical Cross Bar -->
    <rect x="-24" y="-80" width="48" height="160" rx="20" fill="#F1E8DA"/>
    <!-- Horizontal Cross Bar -->
    <rect x="-80" y="-24" width="160" height="48" rx="20" fill="#F1E8DA"/>
    <!-- Center Dot / Pulse -->
    <circle cx="0" cy="0" r="16" fill="#174C45"/>
  </g>

  <!-- Typography: CP Badge -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="900" fill="#F1E8DA" text-anchor="middle" letter-spacing="4">CAREPATH</text>
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#4C9A83" text-anchor="middle" letter-spacing="8">NIGERIA</text>
</svg>
